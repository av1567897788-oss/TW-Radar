name: Daily Simulation

on:
  schedule:
    - cron: '23 6 * * 1-5'  # 14:23 台北時間，週一到週五（收盤後）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run simulation (retry on transient API failure)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for i in 1 2 3; do
            echo "=== attempt $i/3 ==="
            if python sim_runner.py; then
              echo "SIM_OK=true" >> "$GITHUB_ENV"
              break
            fi
            echo "SIM_OK=false" >> "$GITHUB_ENV"
            [ "$i" -lt 3 ] && sleep 60
          done

      - name: Write run status marker
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, os, datetime
          status = "success" if os.environ.get("SIM_OK") == "true" else "failed"
          with open("data/last_run_status.json", "w", encoding="utf-8") as f:
              json.dump({
                  "date": datetime.date.today().isoformat(),
                  "status": status,
                  "checked_at_utc": datetime.datetime.utcnow().isoformat()
              }, f, ensure_ascii=False, indent=2)
          PY

      - run: |
          git config user.name "tw-radar-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Auto-sync simulation.db $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && break
            echo "push rejected, rebasing onto remote (attempt $i/3)"
            git fetch origin main
            git rebase origin/main
            sleep 5
          done

      - name: Fail job if all retries exhausted
        if: env.SIM_OK != 'true'
        run: |
          echo "::error::sim_runner.py failed 3 times today — check FinMind/TWSE API status"
          exit 1
